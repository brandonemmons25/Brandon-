name: WordPress Agent Runner

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "WordPress site URL (e.g. https://www.scottlanderkingman.com)"
        required: true
      command:
        description: "Command to run"
        required: true
        type: choice
        options:
          - kadence-scan
          - kadence-results

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Run command
        env:
          SITE_URL: ${{ github.event.inputs.site_url }}
          COMMAND: ${{ github.event.inputs.command }}
          WP_USER: ${{ secrets.WP_USERNAME }}
          WP_PASS: ${{ secrets.WP_PASSWORD }}
        run: |
          AUTH=$(echo -n "$WP_USER:$WP_PASS" | base64)
          SITE=$(echo "$SITE_URL" | sed 's:/*$::')

          if [ "$COMMAND" = "kadence-scan" ]; then
            echo "## Running Kadence Block Scanner on $SITE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: Basic $AUTH" \
              -H "Content-Type: application/json" \
              "$SITE/wp-json/kbs/v1/scan")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "### Error: HTTP $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$BODY" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            # Parse and summarize results
            TOTAL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d['results']['posts']))" 2>/dev/null || echo "unknown")
            DURATION=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['meta'].get('duration','?'))" 2>/dev/null || echo "?")
            SCANNED_AT=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['meta'].get('scanned_at','?'))" 2>/dev/null || echo "?")

            echo "**Scanned at:** $SCANNED_AT | **Duration:** ${DURATION}s | **Posts with issues:** $TOTAL" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Full JSON output for Claude to parse
            echo "### Full Results" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            echo "$BODY" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "$BODY" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            # Also output raw so it appears in logs
            echo "$BODY"

          elif [ "$COMMAND" = "kadence-results" ]; then
            echo "## Fetching cached Kadence scan results from $SITE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: Basic $AUTH" \
              "$SITE/wp-json/kbs/v1/results")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
              echo "### Error: HTTP $HTTP_CODE" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "$BODY" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            fi

            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$BODY" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "$BODY" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            echo "$BODY"
          fi
