name: Build Plugin Zip

on:
  push:
    branches:
      - 'claude/ihomefinder-full-width-f3SfX'
    paths:
      - 'quick-search-dropdown-fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone --depth 1 --branch claude/ihomefinder-full-width-f3SfX \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/brandonemmons25/Brandon-.git repo

      - name: Create versioned zip
        run: |
          cd repo
          VERSION=$(grep "Version:" quick-search-dropdown-fix/quick-search-dropdown-fix.php | grep -oP '[\d.]+')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          zip -r quick-search-dropdown-fix-v${VERSION}.zip quick-search-dropdown-fix/

      - name: Commit and push zip
        run: |
          cd repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add quick-search-dropdown-fix-v*.zip
          git commit -m "Auto-build v${{ env.VERSION }}: plugin zip" || echo "Nothing to commit"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/brandonemmons25/Brandon-.git HEAD:claude/ihomefinder-full-width-f3SfX

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-search-dropdown-fix-v${{ env.VERSION }}
          path: repo/quick-search-dropdown-fix-v*.zip
          retention-days: 90
